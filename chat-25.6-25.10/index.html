    * { margin: 0; padding: 0; box-sizing: border-box; }

    }

      width: 40px;
      height: 40px;
      background: #0a84ff;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      margin-right: 12px;
    }
    .chat-header .name {
      font-size: 17px;
      font-weight: 500;
      color: #e0e0e0;
    }

    .chat-body {
      flex: 1;
      padding: 15px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .chat-body::-webkit-scrollbar {
      width: 6px;
    }
    .chat-body::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-body::-webkit-scrollbar-thumb {
      background: #555;
      border-radius: 3px;
    }

    /* ========== 消息布局 ========== */

    .message {
      display: flex;
      max-width: 100%;
    }

    /* 用户消息：靠右，无头像，宽度80% */
    .message.right {
      align-self: flex-end;
      max-width: 80%;
    }

    /* 机器人回复：全宽文本 */
    .message.left.bot-text {
      align-self: flex-start;
      max-width: 100%;
    }

    /* 思考消息：全宽文本 */
    .message.thinking {
      align-self: flex-start;
      max-width: 100%;
    }

    .message.right .bubble {
      background: #3a3a3a;
      border: 1px solid #4a4a4a;
      color: #ffffff;
      font-size: 16px;
      line-height: 1.6;
      padding: 10px 14px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: left;

    .message.left.bot-text .bot-content {
      color: #ffffff;
      font-size: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: left;
      padding: 0;

    .message.thinking .thinking-content {

      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: left;
      padding: 0;
      width: 100%;
    }

    /* 所有消息都不显示头像 */
    .avatar-small {
      display: none;
    }
  </style>
</head>

  // ========== 渲染消息 ==========
  const chatBody = document.getElementById('chatBody');

  function renderMessages() {
    chatBody.innerHTML = '';
    messages.forEach(msg => {
      const msgDiv = document.createElement('div');

      if (msg.type === 'user') {
        msgDiv.className = 'message right';
      } else if (msg.type === 'bot') {
        msgDiv.className = 'message left bot-text';
      } else if (msg.type === 'thinking') {
        msgDiv.className = 'message thinking left';
      }

      // 创建内容
      if (msg.type === 'user') {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = msg.text;
        msgDiv.appendChild(bubble);
      } else if (msg.type === 'bot') {
        const content = document.createElement('div');
        content.className = 'bot-content';
        content.textContent = msg.text;
        msgDiv.appendChild(content);
      } else if (msg.type === 'thinking') {
        const content = document.createElement('div');
        content.className = 'thinking-content';
        content.textContent = '已思考：\n' + msg.text;
        msgDiv.appendChild(content);
      }

      chatBody.appendChild(msgDiv);
    });
  }

  renderMessages();
</script>
